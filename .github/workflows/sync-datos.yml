name: Actualizar datos

# Una vez al dia a las 20:17 UTC (21:17 en Espana en invierno, 22:17 en verano) y cuando quieras a mano
# (pestana Actions > "Actualizar datos" > Run workflow). El minuto 17 evita las horas punta de GitHub.
on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r sync/requirements.txt

      - name: Descargar de Garmin y cifrar
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
        run: python sync/nube_sync.py

      - name: Publicar los datos cifrados
        run: |
          git config user.name "run-coach-bot"
          git config user.email "run-coach-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos actualizados"
            git push
          fi
